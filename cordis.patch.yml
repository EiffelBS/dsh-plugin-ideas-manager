# dsh-plugin-ideas-manager bundle patch: inserts the plugin row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field) over dsh-base; install with
# `dsh plugin --profile <name> add link:<cwd>`.
#
# The row is a bare plugin by package name: the node half (exports ".") runs
# in the host process (routes + ledger + the system-prompt announcement
# section), and the `dsh.client` declaration in package.json makes the browser
# half (exports "./client", served at /plugins/<id>/client.js) load in the web
# GUI.
- insert:
    - id: ui-ideas
      name: 'dsh-plugin-ideas-manager'
