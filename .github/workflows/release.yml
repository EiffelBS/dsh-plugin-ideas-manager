name: release

# One release gesture: bump `version` in package.json, commit, then
#   git tag vX.Y.Z && git push origin vX.Y.Z
# The tag publishes to npm (with provenance) and creates the GitHub Release.
#
# One-time setup (npmjs.com): package Settings -> Trusted Publisher ->
# GitHub Actions (user EiffelBS, repo dsh-plugin-ideas-manager,
# workflow release.yml). No NPM_TOKEN secret needed after that.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          # Node 24 ships npm 11.x, required for OIDC trusted publishing
          # (npm publish --provenance with no NPM_TOKEN on the runner).
          node-version: 24
          cache: pnpm

      - name: Tag matches package.json version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "${{ github.ref_name }}" ]; then
            echo "tag ${{ github.ref_name }} != package version $PKG"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      - run: npm publish --provenance --access public

  release-notes:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; skipping"
            exit 0
          fi
          gh release create "$TAG" --title "$TAG" --generate-notes
