name: release

# One release gesture:
#   1. write the user-facing entry in CHANGELOG.md under the new version heading
#   2. bump `version` in package.json, commit
#   3. git tag vX.Y.Z && git push origin vX.Y.Z
# The tag publishes to npm (with provenance), and the GitHub Release body is the
# matching CHANGELOG section — curated notes for users, not the commit log.
#
# One-time setup (npmjs.com): package Settings -> Trusted Publisher ->
# GitHub Actions (user EiffelBS, repo dsh-plugin-ideas-manager,
# workflow release.yml). No NPM_TOKEN secret needed after that.

on:
  push:
    tags: ['v*']

# Releases must never overlap: a second tag landing mid-publish would race the
# registry and the Release body.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The tag IS the release: the version, the changelog section and the
          # "is it on main" check all read the checked-out history.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          # Node 24 ships npm 11.x, required for OIDC trusted publishing
          # (npm publish --provenance with no NPM_TOKEN on the runner).
          node-version: 24
          cache: pnpm

      - name: Tag matches package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$TAG" ]; then
            echo "tag $TAG != package version $PKG"
            exit 1
          fi

      - name: Tag is a release commit on main
        env:
          TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$TAG" "origin/$DEFAULT_BRANCH"; then
            echo "::error::$TAG is not on $DEFAULT_BRANCH; release only what main carries"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      - run: npm publish --provenance --access public

  release-notes:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build the release notes from the changelog
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Exit 3 means "no section for this tag". Fall back to generated
          # notes rather than failing: a missing changelog entry must never
          # block a release, it only has to be loud in the log. The script also
          # appends the npm and changelog links, so those never drift here.
          if node scripts/changelog-notes.mjs "$TAG" "$REPOSITORY" > release-notes.md; then
            echo "release notes built from CHANGELOG.md for $TAG"
          else
            echo "::warning::CHANGELOG.md has no section for $TAG; publishing generated notes"
            rm -f release-notes.md
          fi

      - name: Create GitHub Release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; skipping"
            exit 0
          fi
          if [ -s release-notes.md ]; then
            # Curated notes first, then the generated footer (compare link).
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file release-notes.md \
              --generate-notes
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
